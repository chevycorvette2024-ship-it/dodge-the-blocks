<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge the Blocks - Car Edition</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin: 10px 0 4px;
}

#score {
    font-size: 22px;
    margin-bottom: 6px;
}

#game {
    position: relative;
    width: 90vw;
    max-width: 600px;
    height: 72vh;
    max-height: 700px;
    margin: auto;
    background:
        linear-gradient(
            to right,
            transparent 48%,
            rgba(255,255,255,.15) 49%,
            rgba(255,255,255,.15) 51%,
            transparent 52%
        ),
        #202020;
    border: 4px solid white;
    overflow: hidden;
}

/* ROAD LINES */
.roadLine {
    position: absolute;
    width: 8px;
    height: 60px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
    opacity: .35;
}

/* PLAYER CAR */
#player {
    position: absolute;
    width: 48px;
    height: 70px;
    background: #00ff55;
    border-radius: 12px;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    box-shadow: 0 0 15px #00ff55;
}

/* CAR WINDOWS */
#player::before {
    content: "";
    position: absolute;
    width: 30px;
    height: 22px;
    left: 9px;
    top: 8px;
    background: #111;
    border-radius: 6px;
}

/* CAR LIGHTS */
#player::after {
    content: "";
    position: absolute;
    width: 34px;
    height: 7px;
    left: 7px;
    bottom: 8px;
    background: red;
    border-radius: 5px;
}

/* FALLING BLOCKS */
.block {
    position: absolute;
    width: 42px;
    height: 42px;
    background: red;
    border-radius: 7px;
    box-shadow: 0 0 10px red;
}

/* START SCREEN */
#startScreen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
}

#startScreen h2 {
    font-size: 32px;
}

#startButton {
    font-size: 28px;
    font-weight: bold;
    padding: 20px 45px;
    border: none;
    border-radius: 15px;
    background: #00ff55;
    color: black;
    cursor: pointer;
    box-shadow: 0 0 25px #00ff55;
}

#startButton:hover {
    transform: scale(1.06);
}

#upgradePanel {
    margin: 7px auto;
    max-width: 650px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 5px;
}

.upgrade {
    padding: 7px 9px;
    border: 1px solid white;
    background: #333;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

.upgrade:disabled {
    opacity: .4;
}

#soundStatus {
    font-size: 14px;
    margin-bottom: 3px;
}
</style>
</head>

<body>

<h1>🚗 Dodge the Blocks</h1>

<div id="score">Score: 0</div>
<div id="soundStatus">🔊 Car sounds ready</div>

<div id="game">

    <div class="roadLine" style="top:0px"></div>
    <div class="roadLine" style="top:150px"></div>
    <div class="roadLine" style="top:300px"></div>
    <div class="roadLine" style="top:450px"></div>
    <div class="roadLine" style="top:600px"></div>

    <div id="startScreen">
        <h2>🚗 DODGE THE BLOCKS</h2>
        <p>Use ← → or A / D to drive</p>
        <p>🔊 Engine + acceleration + crash sounds</p>
        <button id="startButton">START GAME</button>
    </div>

    <div id="player"></div>

</div>

<div id="upgradePanel">

    <button class="upgrade" id="speedUpgrade">⚡ Speed</button>
    <button class="upgrade" id="sizeUpgrade">🚗 Bigger Car</button>
    <button class="upgrade" id="slowUpgrade">🐌 Slow Blocks</button>
    <button class="upgrade" id="shieldUpgrade">🛡️ Shield</button>
    <button class="upgrade" id="scoreUpgrade">💰 Bonus Score</button>
    <button class="upgrade" id="doubleUpgrade">✖️ Double Points</button>
    <button class="upgrade" id="freezeUpgrade">❄️ Freeze</button>
    <button class="upgrade" id="lifeUpgrade">❤️ Extra Life</button>

</div>

<script>

/* =========================================
   GAME VARIABLES
========================================= */

const game = document.getElementById("game");
const player = document.getElementById("player");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const scoreDisplay = document.getElementById("score");
const soundStatus = document.getElementById("soundStatus");

let gameRunning = false;

let playerX = 0;
let playerSpeed = 7;
let playerWidth = 48;
let playerHeight = 70;

let score = 0;
let lives = 1;

let blocks = [];

let keys = {};

let lastTime = 0;
let lastBlockSpawn = 0;

let blockInterval = 850;

let shield = false;
let slowBlocks = false;
let bonusScore = false;
let doublePoints = false;
let freezeBlocks = false;


/* =========================================
   AUDIO SYSTEM
========================================= */

let audioContext;
let engineOscillator;
let engineGain;
let engineFilter;

function setupAudio() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

        engineOscillator =
            audioContext.createOscillator();

        engineGain =
            audioContext.createGain();

        engineFilter =
            audioContext.createBiquadFilter();

        engineOscillator.type = "sawtooth";

        engineOscillator.frequency.value = 75;

        engineGain.gain.value = 0.0001;

        engineFilter.type = "lowpass";

        engineFilter.frequency.value = 700;

        engineOscillator
            .connect(engineFilter)
            .connect(engineGain)
            .connect(audioContext.destination);

        engineOscillator.start();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}


/* =========================================
   ENGINE SOUND
========================================= */

function startEngine() {

    setupAudio();

    engineGain.gain.cancelScheduledValues(
        audioContext.currentTime
    );

    engineGain.gain.setTargetAtTime(
        0.06,
        audioContext.currentTime,
        0.08
    );
}

function stopEngine() {

    if (!audioContext) return;

    engineGain.gain.cancelScheduledValues(
        audioContext.currentTime
    );

    engineGain.gain.setTargetAtTime(
        0.0001,
        audioContext.currentTime,
        0.08
    );
}


/* =========================================
   ACCELERATION SOUND
========================================= */

function accelerationSound() {

    if (!audioContext) return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = "square";

    osc.frequency.setValueAtTime(
        100,
        audioContext.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        280,
        audioContext.currentTime + 0.18
    );

    gain.gain.setValueAtTime(
        0.08,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.2
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();
    osc.stop(audioContext.currentTime + 0.2);
}


/* =========================================
   CRASH SOUND
========================================= */

function crashSound() {

    if (!audioContext) return;

    const bufferSize =
        audioContext.sampleRate * 0.35;

    const buffer =
        audioContext.createBuffer(
            1,
            bufferSize,
            audioContext.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        data[i] =
            (Math.random() * 2 - 1) *
            (1 - i / bufferSize);
    }

    const source =
        audioContext.createBufferSource();

    const gain =
        audioContext.createGain();

    gain.gain.value = 0.3;

    source.buffer = buffer;

    source.connect(gain);
    gain.connect(audioContext.destination);

    source.start();
}


/* =========================================
   UPDATE ENGINE PITCH
========================================= */

function updateEngineSound() {

    if (!audioContext || !gameRunning) return;

    let movement = 0;

    if (keys["arrowleft"] || keys["a"]) {
        movement++;
    }

    if (keys["arrowright"] || keys["d"]) {
        movement++;
    }

    let frequency =
        70 + movement * 45 + Math.min(score * 1.2, 80);

    engineOscillator.frequency.setTargetAtTime(
        frequency,
        audioContext.currentTime,
        0.05
    );
}


/* =========================================
   KEY CONTROLS
========================================= */

document.addEventListener("keydown", function(e) {

    keys[e.key.toLowerCase()] = true;

    if (
        gameRunning &&
        (
            e.key === "ArrowLeft" ||
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "a" ||
            e.key.toLowerCase() === "d"
        )
    ) {
        accelerationSound();
    }
});

document.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});


/* =========================================
   START GAME
========================================= */

startButton.addEventListener("click", startGame);

function startGame() {

    setupAudio();

    startEngine();

    gameRunning = true;

    score = 0;
    lives = 1;

    playerSpeed = 7;
    playerWidth = 48;
    playerHeight = 70;

    shield = false;
    slowBlocks = false;
    bonusScore = false;
    doublePoints = false;
    freezeBlocks = false;

    blockInterval = 850;

    scoreDisplay.textContent = "Score: 0";

    startScreen.style.display = "none";

    player.style.display = "block";

    player.style.width =
        playerWidth + "px";

    player.style.height =
        playerHeight + "px";

    playerX =
        (game.clientWidth - playerWidth) / 2;

    player.style.left =
        playerX + "px";

    blocks.forEach(block => {
        block.element.remove();
    });

    blocks = [];

    lastTime = performance.now();

    lastBlockSpawn = performance.now();

    requestAnimationFrame(gameLoop);
}


/* =========================================
   CREATE FALLING BLOCK
========================================= */

function createBlock() {

    const block =
        document.createElement("div");

    block.className = "block";

    const size = 42;

    const x =
        Math.random() *
        (game.clientWidth - size);

    block.style.width = size + "px";
    block.style.height = size + "px";
    block.style.left = x + "px";
    block.style.top = -size + "px";

    game.appendChild(block);

    let speed =
        3 + Math.random() * 3;

    if (slowBlocks) {
        speed *= 0.55;
    }

    blocks.push({
        element: block,
        x: x,
        y: -size,
        size: size,
        speed: speed
    });
}


/* =========================================
   GAME LOOP
========================================= */

function gameLoop(time) {

    if (!gameRunning) return;

    const delta =
        Math.min(time - lastTime, 40);

    lastTime = time;


    /* PLAYER MOVEMENT */

    if (keys["arrowleft"] || keys["a"]) {
        playerX -= playerSpeed;
    }

    if (keys["arrowright"] || keys["d"]) {
        playerX += playerSpeed;
    }


    /* KEEP CAR ON ROAD */

    if (playerX < 0) {
        playerX = 0;
    }

    if (
        playerX >
        game.clientWidth - playerWidth
    ) {
        playerX =
            game.clientWidth - playerWidth;
    }

    player.style.left =
        playerX + "px";


    /* ENGINE SOUND */

    updateEngineSound();


    /* SPAWN BLOCKS */

    if (
        time - lastBlockSpawn >=
        blockInterval
    ) {

        createBlock();

        lastBlockSpawn = time;

        blockInterval =
            Math.max(
                350,
                850 - score * 5
            );
    }


    /* MOVE BLOCKS */

    for (
        let i = blocks.length - 1;
        i >= 0;
        i--
    ) {

        const block = blocks[i];

        if (!freezeBlocks) {

            block.y +=
                block.speed *
                (delta / 16.67);
        }

        block.element.style.top =
            block.y + "px";


        /* COLLISION */

        if (checkCollision(block)) {

            crashSound();

            if (shield) {

                shield = false;

                player.style.border =
                    "none";

                block.element.remove();

                blocks.splice(i, 1);

                continue;
            }

            lives--;

            block.element.remove();

            blocks.splice(i, 1);

            if (lives <= 0) {

                endGame();

                return;
            }
        }


        /* BLOCK PASSED */

        else if (
            block.y >
            game.clientHeight
        ) {

            let points = 1;

            if (bonusScore) {
                points += 1;
            }

            if (doublePoints) {
                points *= 2;
            }

            score += points;

            scoreDisplay.textContent =
                "Score: " + score;

            block.element.remove();

            blocks.splice(i, 1);
        }
    }


    /* MOVE ROAD LINES */

    document
        .querySelectorAll(".roadLine")
        .forEach(line => {

            let top =
                parseFloat(
                    line.style.top
                );

            top +=
                5 +
                Math.min(score / 10, 8);

            if (top > game.clientHeight) {
                top = -60;
            }

            line.style.top =
                top + "px";
        });


    requestAnimationFrame(gameLoop);
}


/* =========================================
   COLLISION DETECTION
========================================= */

function checkCollision(block) {

    const playerY =
        game.clientHeight -
        playerHeight -
        20;

    return (
        playerX <
            block.x + block.size &&
        playerX + playerWidth >
            block.x &&
        playerY <
            block.y + block.size &&
        playerY + playerHeight >
            block.y
    );
}


/* =========================================
   GAME OVER
========================================= */

function endGame() {

    gameRunning = false;

    stopEngine();

    player.style.display = "none";

    startScreen.style.display =
        "flex";

    startButton.textContent =
        "PLAY AGAIN";

    const message =
        document.createElement("p");

    message.textContent =
        "💥 Game Over! Final Score: " +
        score;

    startScreen.insertBefore(
        message,
        startButton
    );

    setTimeout(() => {

        if (message.parentNode) {
            message.remove();
        }

    }, 2500);
}


/* =========================================
   UPGRADE 1: SPEED
========================================= */

document
.getElementById("speedUpgrade")
.addEventListener("click", function() {

    playerSpeed += 3;

    this.disabled = true;
});


/* =========================================
   UPGRADE 2: BIGGER CAR
========================================= */

document
.getElementById("sizeUpgrade")
.addEventListener("click", function() {

    playerWidth += 8;
    playerHeight += 10;

    player.style.width =
        playerWidth + "px";

    player.style.height =
        playerHeight + "px";

    this.disabled = true;
});


/* =========================================
   UPGRADE 3: SLOW BLOCKS
========================================= */

document
.getElementById("slowUpgrade")
.addEventListener("click", function() {

    slowBlocks = true;

    blocks.forEach(block => {
        block.speed *= 0.55;
    });

    this.disabled = true;
});


/* =========================================
   UPGRADE 4: SHIELD
========================================= */

document
.getElementById("shieldUpgrade")
.addEventListener("click", function() {

    shield = true;

    player.style.border =
        "4px solid cyan";

    player.style.boxShadow =
        "0 0 25px cyan";

    this.disabled = true;
});


/* =========================================
   UPGRADE 5: BONUS SCORE
========================================= */

document
.getElementById("scoreUpgrade")
.addEventListener("click", function() {

    bonusScore = true;

    this.disabled = true;
});


/* =========================================
   UPGRADE 6: DOUBLE POINTS
========================================= */

document
.getElementById("doubleUpgrade")
.addEventListener("click", function() {

    doublePoints = true;

    this.disabled = true;
});


/* =========================================
   UPGRADE 7: FREEZE
========================================= */

document
.getElementById("freezeUpgrade")
.addEventListener("click", function() {

    freezeBlocks = true;

    this.textContent =
        "❄️ Frozen!";

    this.disabled = true;

    setTimeout(() => {

        freezeBlocks = false;

        this.textContent =
            "❄️ Freeze";

    }, 5000);
});


/* =========================================
   UPGRADE 8: EXTRA LIFE
========================================= */

document
.getElementById("lifeUpgrade")
.addEventListener("click", function() {

    lives++;

    this.disabled = true;
});

</script>

</body>
</html>
